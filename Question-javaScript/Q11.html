<body>
<script>

for(let n=100; n<=999; n++){
    let temp =n;
    let sum = 0;
    while(temp > 0){
        let digit = temp % 10;
        sum = sum + digit *digit * digit;
        temp = Math.floor(temp/10);
    }
    if(sum===n){
        console.log(n);
    }
}
</script>
