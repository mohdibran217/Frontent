<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Page Title</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="container">
        <div class="box"></div>
        <div class="RB">

            <div class="Rbox">
                <p>CLEAR</p>
            </div>
            <div class="Bbox">
                <p>DELETE</p>
            </div>
        </div>
        <div class="number">
            <div class="tab">
                <p> 7</p>
            </div>
            <div class="tab">
                <p> 8</p>
            </div>
             <div class="tab">
                <p> 9</p>
            </div>
             <div class="tab">
                <p> +</p>
            </div>
             <div class="tab">
                <p> 4</p>
            </div>
             <div class="tab">
                <p> 5</p>
            </div>
             <div class="tab">
                <p> 6</p>
            </div>
             <div class="tab">
                <p> *</p>
            </div>
             <div class="tab">
                <p> 1</p>
            </div>
             <div class="tab">
                <p> 2</p>
            </div>
             <div class="tab">
                <p> 3</p>
            </div>
             <div class="tab">
                <p> -</p>
            </div>
             <div class="tab">
                <p> .</p>
            </div>
             <div class="tab">
                <p> 0</p>
            </div>
             <div class="tab">
                <p> =</p>
            </div>
             <div class="tab">
                <p> /</p>
            </div>

            
        </div>

    </div>
    <script src="script.js"></script>
  </body>
</html>
